name: refresh-prices
on:
  schedule:
    - cron: "45 21 * * 1-5"   # ~after US market close, weekdays (UTC)
  workflow_dispatch: {}        # lets you run it manually the first time
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance
      - run: python fetch_prices.py
      - name: commit & push if changed
        run: |
          git config user.name  "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add docs/prices.json
          git commit -m "prices $(date -u +%F)" || echo "no change"
          git push
